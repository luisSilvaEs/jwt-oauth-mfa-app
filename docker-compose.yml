# =============================================================================
# docker-compose.yml
# jwt-oauth-mfa-app — Full Stack with nginx Load Balancer
# =============================================================================
#
# Usage:
#   Build & Start:  docker compose up -d --build
#   Stop:           docker compose down
#   Logs:           docker compose logs -f
#   Reset DB:       docker compose down -v   ← WARNING: deletes all DB data
# =============================================================================

volumes:
  postgres_data:
  pgadmin_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — shared by all backend instances
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: jwt_mfa_postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # pgAdmin — DB GUI at http://localhost:5050
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jwt_mfa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: adminpass
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend instances — Spring Boot × 3
  # env_file loads everything from .env (JWT, OAuth secrets, etc.)
  # environment: overrides only DB_URL (localhost → postgres) and adds INSTANCE_ID
  # ---------------------------------------------------------------------------
  backend-1:
    build: ./backend
    container_name: jwt_mfa_backend_1
    env_file:
      - backend/.env                                              # loads JWT, OAuth, DB creds
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authdb      # overrides localhost in .env
      INSTANCE_ID: backend-1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth_network
      - komodo_shared_network   # reachable by Komodo's nginx

  backend-2:
    build: ./backend
    container_name: jwt_mfa_backend_2
    env_file:
      - backend/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authdb
      INSTANCE_ID: backend-2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth_network
      - komodo_shared_network   # reachable by Komodo's nginx

  backend-3:
    build: ./backend
    container_name: jwt_mfa_backend_3
    env_file:
      - backend/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authdb
      INSTANCE_ID: backend-3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth_network
      - komodo_shared_network   # reachable by Komodo's nginx

networks:
  auth_network:
    driver: bridge
  komodo_shared_network:
    external: true   