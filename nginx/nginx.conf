# =============================================================================
# nginx.conf — Load Balancer Configuration
# =============================================================================

events {
    worker_connections 1024;
}

http {

    # -------------------------------------------------------------------------
    # Upstream pool — the 3 Spring Boot instances
    # ip_hash: same client IP always routes to same backend.
    # NOTE: This is a band-aid for stateful MFA secret storage.
    #       The real fix is to persist mfaTempSecret in the DB, not in-memory.
    # -------------------------------------------------------------------------
    upstream backend_pool {
        ip_hash;
        server backend-1:8080;
        server backend-2:8080;
        server backend-3:8080;
    }

    server {
        listen 80;

        # -----------------------------------------------------------------------
        # API routes — proxied to the backend pool
        # -----------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;

            # 🔑 FIXED: Forward the Authorization header to the backend
            proxy_set_header   Authorization      $http_authorization;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------------
        # OAuth2 routes — same pool, needed for Google/GitHub redirect callbacks
        # -----------------------------------------------------------------------
        location /oauth2/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /login/oauth2/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;

            # Forward Authorization here too for consistency
            proxy_set_header   Authorization      $http_authorization;
        }
    }
}