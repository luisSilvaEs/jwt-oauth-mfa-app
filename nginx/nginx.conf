# =============================================================================
# nginx.conf — Load Balancer Configuration
# =============================================================================

events {
    worker_connections 1024;
}

http {

    # -------------------------------------------------------------------------
    # Upstream pool — the 3 Spring Boot instances
    # Default strategy: round-robin (nginx cycles through them in order)
    # Swap in `least_conn;` to route to the server with fewest active connections
    # Swap in `ip_hash;`    to make OAuth redirect flows sticky per client IP
    # -------------------------------------------------------------------------
    upstream backend_pool {
        # least_conn;   ← uncomment for least-connections balancing
        ip_hash;        # ← same client IP always routes to same backend
        server backend-1:8080;
        server backend-2:8080;
        server backend-3:8080;
    }

    server {
        listen 80;

        # -----------------------------------------------------------------------
        # API routes — proxied to the backend pool
        # -----------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------------
        # OAuth2 routes — same pool, needed for Google/GitHub redirect callbacks
        # -----------------------------------------------------------------------
        location /oauth2/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /login/oauth2/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }
    }
}